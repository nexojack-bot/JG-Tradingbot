# Render "Blueprint" — lets Render auto-configure the service from this
# file instead of you filling in every field by hand in the dashboard.
# See GITHUB_SETUP.md in this zip for the step-by-step walkthrough.
services:
  - type: web
    name: jg-tradingbot-fundamentals-api
    runtime: python
    plan: free
    rootDir: screener_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
